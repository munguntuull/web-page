<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="form.css">
</head>

<body>

<header>
    <h1>Student Registration Form</h1>
</header>

<main>
    <form>

        <fieldset>
            <legend>Basic Information</legend>

            <div class="form-row">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name">
            </div>

            <div class="form-row">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
            </div>

            <div class="form-row">
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone">
            </div>

            <div class="form-row">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password">
            </div>

            <div class="form-row">
                <label for="birth">Birth Date:</label>
                <input type="date" id="birth" name="birth">
            </div>

        </fieldset>

        <fieldset>
            <legend>Preferences</legend>

            <div class="check-row">
                <span class="spacer">Gender:</span>
                <label><input type="radio" name="gender"> Male</label>
                <label><input type="radio" name="gender"> Female</label>
                <label><input type="radio" name="gender"> Other</label>
            </div>

            <div class="check-row">
                <span class="spacer">Interests:</span>
                <label><input type="checkbox" name="interest"> Sports</label>
                <label><input type="checkbox" name="interest"> Music</label>
                <label><input type="checkbox" name="interest"> Tech</label>
            </div>

            <div class="form-row">
                <label for="state">State:</label>
                <select id="state" name="state">
                    <option>Hawaii</option>
                    <option>California</option>
                    <option>Utah</option>
                </select>
            </div>

            <div class="form-row">
                <label for="message">Comments:</label>
                <textarea id="message" name="message"></textarea>
            </div>

            <div class="check-row">
                <span class="spacer"></span>
                <label>
                    <input type="checkbox" name="agree">
                    I accept the terms
                </label>
            </div>

            <div class="form-row">
                <span class="spacer"></span>
                <input type="submit" value="Submit">
            </div>

        </fieldset>

    </form>
</main>

<footer>
    <p>© 2026 Munguntuul</p>
</footer>

</body>
</html>
